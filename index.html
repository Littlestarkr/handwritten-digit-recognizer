<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Handwritten Digit Recognizer</title>
<style>
  :root {
    --bg: #f4f4f6;
    --panel: #ffffff;
    --ink: #1a1a1f;
    --muted: #6b6b76;
    --accent: #4f46e5;
    --accent-ink: #ffffff;
    --border: #dadae2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111114;
      --panel: #1b1b20;
      --ink: #f1f1f4;
      --muted: #9a9aa4;
      --accent: #818cf8;
      --accent-ink: #15151a;
      --border: #303039;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111114;
    --panel: #1b1b20;
    --ink: #f1f1f4;
    --muted: #9a9aa4;
    --accent: #818cf8;
    --accent-ink: #15151a;
    --border: #303039;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }

  h1 {
    font-size: 1.25rem;
    margin: 0 0 4px;
  }

  p.sub {
    color: var(--muted);
    margin: 0 0 20px;
    font-size: 0.9rem;
  }

  #canvas {
    background: #000;
    border-radius: 12px;
    touch-action: none;
    cursor: crosshair;
    width: 100%;
    max-width: 280px;
    aspect-ratio: 1 / 1;
  }

  .result {
    margin: 18px 0;
    font-size: 1.4rem;
    font-weight: 600;
    min-height: 1.8em;
  }

  .result .conf {
    font-size: 0.95rem;
    font-weight: 400;
    color: var(--muted);
  }

  .bars {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 4px;
    height: 48px;
    margin: 10px 0 20px;
  }

  .bar {
    width: 18px;
    background: var(--border);
    border-radius: 3px 3px 0 0;
    position: relative;
    transition: height 0.15s ease;
  }

  .bar.top {
    background: var(--accent);
  }

  .bar span {
    position: absolute;
    bottom: -18px;
    left: 0;
    right: 0;
    font-size: 0.7rem;
    color: var(--muted);
  }

  .controls {
    display: flex;
    gap: 10px;
  }

  button {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--ink);
    font-size: 0.95rem;
    cursor: pointer;
  }

  button.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .status {
    margin-top: 14px;
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Handwritten Digit Recognizer</h1>
    <p class="sub">Draw a digit (0-9) with your mouse or finger</p>

    <canvas id="canvas" width="280" height="280"></canvas>

    <div class="result" id="result">Draw a digit</div>
    <div class="bars" id="bars"></div>

    <div class="controls">
      <button id="clearBtn">Clear</button>
    </div>

    <div class="status" id="status">Loading model...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
